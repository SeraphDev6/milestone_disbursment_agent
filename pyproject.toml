[project]
name = "milestone-disbursment-agent"
version = "0.1.0"
description = "Milestone disbursement engine: checkable criteria, verified evidence, PayPal settlement."
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.4.0",
    "boto3>=1.35",
    "cryptography>=50.0.2",
    "dnspython>=2.9.1",
    "fastapi>=0.162.0",
    "fastmcp==4.1.6",
    "httpx>=0.28.1",
    "joserfc>=1.8.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "paypal-server-sdk>=2.4.0",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-ai-slim[anthropic]>=2.65.0",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "reportlab>=5.1.0",
    "sqlalchemy>=2",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
sandbox = [
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "sdk/python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
