name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Core SDK spec is up to date
        run: uv run python -m app.sdk_spec --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core SDK spec lints clean (what an SDK generator sees)
        run: npx --yes @redocly/cli@1.34.3 lint sdk/openapi-core.json
      - run: uv run pytest -q
