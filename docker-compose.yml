# Local Postgres. Without it the app falls back to SQLite at ./local.db.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: milestone
      POSTGRES_PASSWORD: milestone
      POSTGRES_DB: milestone
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
