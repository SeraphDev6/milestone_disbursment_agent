# Render Blueprint: the web service (API + web app), Postgres, and the two scheduled jobs.
#
# Render prompts for every `sync: false` value when the Blueprint is first created (they can be left blank and
# filled in later from the dashboard). MODE is sandbox (PayPal sandbox, with the PayPal keys, ANTHROPIC_API_KEY and
# Resend); set it to mock here for a demo without keys. The Blueprint auto-syncs, so a value changed only in the
# dashboard is put back to what this file says on the next merge. One web instance runs the
# outbound-webhook loop in-process; payouts and the daily sweep run as cron jobs here so several instances never
# race on the same tranche (PAYOUTS_INTERVAL_SECONDS=0 on the web). Blueprint environment groups only take
# literal values, so the secrets and the database link are repeated per service.
services:
  - type: web
    name: milestone-engine
    runtime: python
    plan: starter # free instances sleep after 15 idle minutes and take up to a minute to wake
    buildCommand: pip install uv && uv sync --frozen --no-dev && cd web && npm ci && npm run build
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - fromGroup: milestone-engine-env
      - key: DATABASE_URL
        fromDatabase:
          name: milestone-engine-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PAYOUTS_INTERVAL_SECONDS
        value: "0"
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://app.milestone-ledger.com (unset: Render's own URL via RENDER_EXTERNAL_URL)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false # R2: https://<account id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # Hourly: pay tranches whose dispute window closed, follow Payouts in flight, mirror PayPal's 28-day release.
  # The jobs share the web service's SECRET_KEY: stored files are encrypted with a key derived from it (unless
  # FILE_ENCRYPTION_KEY is set), and the daily retention sweep and `encrypt-files` write those files.
  - type: cron
    name: milestone-engine-payouts
    runtime: python
    schedule: "7 * * * *"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev python -m app.jobs payouts
    envVars:
      - fromGroup: milestone-engine-env
      - key: DATABASE_URL
        fromDatabase:
          name: milestone-engine-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: milestone-engine
          envVarKey: SECRET_KEY
      - key: AUTO_MIGRATE
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # Daily: drop expired PayPal holds (29 days), close invoices unpaid for 30 days, mark tranches overdue.
  - type: cron
    name: milestone-engine-daily
    runtime: python
    schedule: "15 6 * * *"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev python -m app.jobs daily
    envVars:
      - fromGroup: milestone-engine-env
      - key: DATABASE_URL
        fromDatabase:
          name: milestone-engine-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: milestone-engine
          envVarKey: SECRET_KEY
      - key: AUTO_MIGRATE
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false # R2: https://<account id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

# Literal values shared by every service. Change them here, not in the dashboard: each sync resets them to these.
envVarGroups:
  - name: milestone-engine-env
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MODE
        value: sandbox
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "Milestone Ledger <notify@mail.milestone-ledger.com>"
      # s3: files go to the R2 bucket set (S3_*) on the web and daily services; after the first deploy with it, run
      # `python -m app.jobs encrypt-files` once from the web service's shell to move the files already in Postgres.
      # database keeps them in Postgres (the app won't start with s3 and no bucket settings).
      - key: FILE_STORAGE
        value: s3

databases:
  - name: milestone-engine-db
    # Render deletes a free Postgres 30 days after creation (14 days' grace), which is before judging ends
    # (Dec 21); the smallest paid plan keeps the data.
    plan: basic-256mb
    postgresMajorVersion: "16"
